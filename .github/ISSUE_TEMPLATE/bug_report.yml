name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: feed
    attributes:
      label: Show or feed address
      description: If it's about one show, its name or feed address helps most.
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options: [Playback, New episodes, Up next, Downloads, Discover or search, Following a show, Import or export, Other]
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [Computer, Tablet, Phone]
  - type: input
    id: version
    attributes:
      label: Earshot version
      placeholder: "1.1.0"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots
      description: Attach a screenshot if it shows the problem. Leave out anything private.
